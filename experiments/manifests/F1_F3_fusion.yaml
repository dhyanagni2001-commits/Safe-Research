experiment:
  id: F1_F3
  name: concat_and_static_weight_fusion
  owner: Dhyan
  status: VALIDATED
  models: [concat_fusion, static_weight_fusion]
  implementation_files:
    - failure_prob/models/concat_fusion.py
    - failure_prob/models/static_weight_fusion.py
    - failure_prob/models/probe_heads.py
    - failure_prob/fusion_runner.py
    - scripts/run_fusion.py
  configs:
    - configs/models/concat_fusion.yaml
    - configs/models/static_weight_fusion.yaml
  tests:
    - python -m pytest -q tests/test_fusion_models.py tests/test_fusion_runner.py
  depends_on: [B6 probe spec, B4 evaluator, S1-S6 layer sets]
  selection_split: seen_val
  horizon: task_min_step
  training_command: python scripts/run_fusion.py --model static_weight_fusion --layers 16 33 --cache "$CACHE" --output-dir outputs/fusion/swf_L16_L33
  note: Validated on synthetic features and a synthetic 34-layer cache only; not trained or evaluated on the real cache.
